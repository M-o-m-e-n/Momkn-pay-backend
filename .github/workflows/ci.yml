name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Formatting, unit tests (*Test) and integration tests (*IT, Testcontainers uses the runner's Docker)
      - name: Verify
        run: ./mvnw -B -ntp verify

      # the contract check is OpenApiContractIT (part of verify); this keeps the generated spec
      # and the coverage report for review on every run
      - name: Upload generated OpenAPI and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-and-coverage
          path: |
            target/openapi-generated.json
            target/site/jacoco

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit

      - name: Scan git history for secrets (gitleaks)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
