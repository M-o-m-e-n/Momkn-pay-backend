# gitleaks: default rules plus an allowlist of documented NON-secrets.
# Only exact values are allowed, so any other key-like string still fails the scan.
title = "Momkn Pay"

[extend]
useDefault = true

[allowlist]
description = "Test-only keys and documentation examples"
regexes = [
    # test master key: base64 of bytes 0x00..0x1f (src/test/resources/config/application.yml)
    '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''',
    # deliberately invalid 16-byte key used by StartupValidationTest
    '''AAECAwQFBgcICQoLDA0ODw==''',
    # example sessionKey in docs/LLD.md and docs/openapi.yaml
    '''q9Jx0l3pY8u2cVt1kQe7nR4sW6zB5mH0aD3fG8jK2Lc=''',
]
