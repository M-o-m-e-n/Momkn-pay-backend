server:
  port: ${SERVER_PORT:8443}
  # HTTPS only: the single connector is TLS, there is no plain-HTTP listener (NFR-SEC-8)
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE_PATH:certs/keystore.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: momknpay
    enabled-protocols: TLSv1.3,TLSv1.2
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: momknpay-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:momknpay}
    username: ${DB_USER:momknpay}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true   # a read-only or misspelled field is a VALIDATION_ERROR
  mvc:
    problemdetails:
      enabled: false                     # the error envelope is the only error format
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:com/momknpay/db/migration

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
