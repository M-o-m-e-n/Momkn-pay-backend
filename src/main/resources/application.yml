server:
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: momknpay-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:momknpay}
    username: ${DB_USER:momknpay}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true   # a read-only or misspelled field is a VALIDATION_ERROR
  mvc:
    problemdetails:
      enabled: false                     # the error envelope is the only error format
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:com/momknpay/db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
